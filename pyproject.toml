[project]
name = "edu-c2-045"
version = "1.0.0"
description = "SchoolExcursionRiskAssessmentAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# installed from the package registry by the run-tests job in .gitlab-ci.yml
# (wheel-only since the ci_stubs cutover). Pinning it here would make
# `pip install -e .` fail because it is not resolvable from the default index.
# pyyaml is a real runtime dependency: PB-7 and the project runtime loader read
# config/config.yaml when checking hitl.enabled and domain overrides.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# AgentCore 1.0.x does not publish a py.typed marker yet. Keep project code
# strict while avoiding false failures at that untyped package boundary.
disable_error_code = ["import-untyped"]
disallow_subclassing_any = false
